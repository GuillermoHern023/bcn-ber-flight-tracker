name: BCN to BER Flight Price Tracker (Hourly Early Morning + Daytime Cloud Automation)

on:
  schedule:
    # Runs hourly super early in the morning (1am, 2am, 3am, 4am, 5am, 6am, 7am, 8am CET)
    # plus daytime checks (10am, 1pm, 4pm, 7pm, 10pm CET) at off-peak minute :23
    - cron: "23 0,1,2,3,4,5,6,7,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      force_summary:
        description: "Force send daily summary email even if already sent today"
        required: false
        default: "false"

concurrency:
  group: flight-tracker-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-flights:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      DASHBOARD_URL: "https://guillermohern023.github.io/bcn-ber-flight-tracker/dashboard.html"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ryanair-py beautifulsoup4

      - name: Execute Flight Tracker & Email Engine
        run: |
          if [ "${{ github.event.inputs.force_summary }}" = "true" ]; then
            python flight_tracker.py --force-summary
          else
            python flight_tracker.py
          fi

      - name: Commit & Push Updated Database & Live Dashboard to GitHub Pages
        run: |
          git config user.name "Antigravity Flight Tracker Bot"
          git config user.email "guillejhl@gmail.com"
          git add flight_history.db flight_data.json dashboard.html index.html latest_flight_report.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(tracker): automated flight price & dashboard update [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $attempt failed; waiting 4s before retry..."
              sleep 4
            done
          fi
